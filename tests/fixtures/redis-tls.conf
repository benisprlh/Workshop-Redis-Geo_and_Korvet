# Instance khusus uji; semua sertifikat dan akun adalah fixture lokal.
# redis-acl.users berisi password fixture, bukan kredensial instruktur/endpoint eksternal.
port 0
tls-port 6379
tls-cert-file /certs/server.crt
tls-key-file /certs/server.key
tls-ca-cert-file /certs/ca.pem
tls-auth-clients yes
aclfile /etc/redis/lab.users
save ""
appendonly no
